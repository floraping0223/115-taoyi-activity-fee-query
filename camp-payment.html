<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>115年11月宿營繳費查詢</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="camp-payment.css?v=1"></head>
<body><main class="app-shell payment-shell"><header class="query-panel"><div class="brand-row"><div class="mark">115</div><div><h1>115年11月宿營繳費查詢</h1><p>查詢人工審核後的應繳費用與匯款資訊</p></div></div><p class="intro">請輸入家庭編號。審核完成後，才會顯示核定金額及收款帳號。</p><form id="paymentLookup"><label for="paymentFamily">家庭編號</label><div class="input-row"><input id="paymentFamily" type="text" inputmode="numeric" pattern="[0-9]+" required autocomplete="off" placeholder="例如：16"><button id="lookupButton" type="submit">查詢</button></div></form><p id="paymentStatus" class="message" role="status" hidden></p></header>
<section id="approvedPanel" hidden><section class="section-block"><h2>家庭 <span id="approvedFamily"></span>｜核定費用</h2><div id="feeItems"></div><p id="adjustmentNote" class="adjustment" hidden></p><div class="approved-total"><span>核定應繳總額</span><strong id="approvedTotal"></strong></div></section>
<section class="section-block"><h2>家庭成員填報安排</h2><p class="muted">以下為原調查填報內容。實際收費以上方人工核定金額及調整說明為準。</p><div id="memberPlans"></div></section>
<section id="bankPanel" class="section-block"><h2>匯款帳號</h2><dl><div><dt>銀行</dt><dd id="bankName"></dd></div><div><dt>帳號</dt><dd id="bankAccount"></dd></div><div><dt>戶名</dt><dd id="bankHolder"></dd></div></dl><p class="muted">請確認核定金額後匯款，再填寫下方回報。</p></section>
<section class="section-block"><h2>匯款訊息回報</h2><p id="reportNotice" class="muted" role="status"></p><form id="paymentReport" class="report-form"><label><span>家庭編號</span><input id="reportFamily" readonly></label><label><span>匯款日期</span><input id="reportDate" type="date" required></label><label><span>實際匯款金額</span><input id="reportAmount" type="number" min="1" step="1" required></label><label><span>轉帳後五碼</span><input id="reportLastFive" type="text" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" required placeholder="請輸入5位數字"></label><button id="reportButton" type="submit">送出匯款回報</button></form><p id="reportResult" role="status" class="muted"></p></section></section>
</main><script src="camp-payment-config.js?v=1"></script><script src="camp-payment.js?v=1"></script></body></html>
