<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>115桃一家庭出席確認表</title>
  <meta name="description" content="115桃一家庭出席確認表">
  <meta property="og:title" content="115桃一家庭出席確認表">
  <meta property="og:description" content=" ">
  <meta property="og:type" content="website">
  <meta name="twitter:title" content="115桃一家庭出席確認表">
  <meta name="twitter:description" content=" ">
  <link rel="stylesheet" href="../styles.css?v=5">
</head>
<body data-app-mode="family">
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">桃一親子團</p>
        <h1>115桃一家庭出席確認表</h1>
      </div>
      <div class="event-badge" id="openState">第 1 場</div>
    </header>

    <section class="event-panel" aria-label="活動設定">
      <label>
        <span>活動場次</span>
        <select id="eventSelect"></select>
      </label>
      <label>
        <span>活動日期</span>
        <input id="eventDate" type="date">
      </label>
      <label>
        <span>活動名稱</span>
        <input id="eventName" type="text">
      </label>
      <label class="switch-row">
        <input id="eagleSplit" type="checkbox">
        <span>本場啟用育成鷹團分流</span>
      </label>
      <label class="switch-row">
        <input id="preOpen" type="checkbox">
        <span>開放家庭會前確認</span>
      </label>
      <label class="switch-row">
        <input id="onsiteOpen" type="checkbox">
        <span>開放現場點名</span>
      </label>
      <label>
        <span>Apps Script URL</span>
        <input id="scriptUrl" type="url" placeholder="部署後貼上 Web App URL">
      </label>
      <button id="syncGoogle" type="button">同步 Google</button>
      <button id="clearLocalTestData" type="button" class="danger-outline">清除本機測試資料</button>
    </section>

    <nav class="tabbar" aria-label="主要頁面">
      <button class="tab-button is-active" type="button" data-view="overview">總覽</button>
      <button class="tab-button" type="button" data-view="family">家庭確認</button>
      <button class="tab-button" type="button" data-view="expected">預計名單</button>
      <button class="tab-button" type="button" data-view="checkin">現場點名</button>
      <button class="tab-button" type="button" data-view="annual">全年總表</button>
    </nav>

    <section id="overviewView" class="view is-active" aria-label="當日管理總覽">
      <div class="metric-grid" id="metricGrid"></div>
      <section class="alert-panel">
        <div>
          <h2>無家庭成人陪同的實到兒童</h2>
          <p>以家庭編號與上午/下午時段交叉核對，不要求成人與孩子同場地。</p>
        </div>
        <div id="familyAlerts" class="alert-list"></div>
      </section>
      <section class="section-grid" id="overviewGroups"></section>
    </section>

    <section id="familyView" class="view" aria-label="家庭會前確認">
      <section id="familyEventSummary" class="family-event-summary" aria-label="本次活動資訊"></section>
      <div class="family-lookup">
        <label>
          <span>輸入家庭編號</span>
          <input id="familySearch" type="search" inputmode="numeric" placeholder="例如 16">
        </label>
        <button id="loadFamily" type="button">載入家庭</button>
      </div>
      <div id="familyCards" class="person-list"></div>
      <div id="familyConfirmPanel" class="confirm-panel"></div>
    </section>

    <section id="expectedView" class="view" aria-label="會前預計出席名單">
      <div class="expected-header">
        <div>
          <p class="eyebrow">會前自動產生</p>
          <h2>本場預計出席名單</h2>
        </div>
        <p>依家庭確認結果分流。育成會與老鷹單飛入口可在這裡安排家長支援團隊與職務；若選小蟻團、炫蜂團、奔鹿團，會進入該團團隊現場點名。</p>
      </div>
      <div id="expectedLists" class="expected-lists"></div>
    </section>

    <section id="checkinView" class="view" aria-label="現場點名">
      <div class="entrance-grid" id="entranceGrid"></div>
      <section class="checkin-board">
        <div class="board-toolbar">
          <div>
            <p class="eyebrow">固定入口</p>
            <h2 id="boardTitle">小蟻點名</h2>
          </div>
          <label>
            <span>搜尋</span>
            <input id="memberSearch" type="search" placeholder="姓名、家庭、小隊">
          </label>
        </div>
        <div class="squad-tabs" id="squadTabs"></div>
        <div id="checkinRecorderPanel" class="confirm-panel"></div>
        <div id="checkinList" class="person-list"></div>
        <form id="guestForm" class="guest-form">
          <h3>臨時出席</h3>
          <div class="guest-toggle" role="group" aria-label="臨時出席">
            <label><input type="radio" name="guestMode" value="none" checked><span>無</span></label>
            <label><input type="radio" name="guestMode" value="has"><span>有</span></label>
          </div>
          <div class="guest-fields" hidden>
            <input name="familyId" placeholder="家庭編號">
            <input name="name" placeholder="自然名">
            <button type="submit">加入本場點名</button>
          </div>
        </form>
        <div id="checkinSubmitPanel" class="confirm-panel"></div>
      </section>
    </section>

    <section id="annualView" class="view" aria-label="全年12次出勤總表">
      <section class="rules-panel" aria-label="出勤規則設定">
        <div>
          <p class="eyebrow">出勤規則設定</p>
          <h2>孩子缺席權重</h2>
        </div>
        <div class="rules-grid">
          <label>
            <span>正常全天</span>
            <input id="rulePresent" type="number" min="0" max="1" step="0.5">
          </label>
          <label>
            <span>遲到</span>
            <input id="ruleLate" type="number" min="0" max="1" step="0.5">
          </label>
          <label>
            <span>上午請假</span>
            <input id="ruleMorning" type="number" min="0" max="1" step="0.5">
          </label>
          <label>
            <span>下午請假</span>
            <input id="ruleAfternoon" type="number" min="0" max="1" step="0.5">
          </label>
          <label>
            <span>全天缺席/請假</span>
            <input id="ruleAbsent" type="number" min="0" max="1" step="0.5">
          </label>
        </div>
      </section>
      <div class="annual-toolbar">
        <label>
          <span>篩選團別/小隊/姓名/家庭</span>
          <input id="annualSearch" type="search" placeholder="輸入關鍵字">
        </label>
      </div>
      <div id="annualList" class="annual-list"></div>
    </section>
  </main>

  <template id="personCardTemplate">
    <article class="person-card">
      <div class="person-main">
        <div>
          <p class="person-meta"></p>
          <h3 class="person-name"></h3>
        </div>
        <strong class="person-status"></strong>
      </div>
      <div class="button-row status-actions"></div>
      <div class="adult-row">
        <label class="check-tile">
          <input class="am-check" type="checkbox">
          <span>上午實到</span>
        </label>
        <label class="check-tile">
          <input class="pm-check" type="checkbox">
          <span>下午13:00實到</span>
        </label>
      </div>
      <div class="split-row"></div>
      <input class="note-field" type="text" placeholder="備註/請假事由">
    </article>
  </template>

  <script src="../data.js?v=5"></script>
  <script src="../config.js?v=5"></script>
  <script src="../app.js?v=5"></script>
</body>
</html>
